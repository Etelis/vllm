apiVersion: v1
kind: Pod
metadata:
  name: sse-bench
  namespace: etelis-moe
spec:
  restartPolicy: Never
  containers:
  - name: vllm
    image: vllm/vllm-openai:nightly
    command: ["sleep", "infinity"]
    env:
    - {name: HF_HOME, value: /cache/hf}
    - {name: VLLM_USE_RUST_FRONTEND, value: "0"}
    resources:
      limits: {nvidia.com/gpu: "1", cpu: "32", memory: 128Gi}
      requests: {nvidia.com/gpu: "1", cpu: "32", memory: 128Gi}
    volumeMounts:
    - {name: cache, mountPath: /cache}
    - {name: results, mountPath: /results}
    - {name: shm, mountPath: /dev/shm}
  volumes:
  - {name: cache, persistentVolumeClaim: {claimName: model-cache}}
  - {name: results, persistentVolumeClaim: {claimName: results}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
